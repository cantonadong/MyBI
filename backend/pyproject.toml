[project]
name = "data-workbench-api"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20",
  "duckdb>=2.0",
  "fastapi>=0.161",
  "psycopg[binary]>=3.3",
  "pyarrow>=26",
  "python-calamine>=0.9",
  "python-multipart>=0.0.22",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.40",
  "cryptography>=46",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["httpx>=0.28", "pytest>=9", "openpyxl>=3.1", "xlwt==1.3.0", "playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning"]

